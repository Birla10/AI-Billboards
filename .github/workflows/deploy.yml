name: Deploy Backend to EC2

on:
  push:
    branches:
      - main  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ec2_key.pem
          chmod 400 ec2_key.pem

      - name: Deploy Backend to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ec2-user@18.191.162.75 << 'EOF'
            # Navigate to or create the app directory for backend
            cd /home/ec2-user/ai-billboards/backend || mkdir -p /home/ec2-user/ai-billboards/backend && cd /home/ec2-user/ai-billboards/backend
            
            # Clone or pull the latest code
            if [ ! -d .git ]; then
              git clone --depth 1 --filter=blob:none --sparse https://${{ secrets.GIT_PAT }}@github.com/Birla10/AI-Billboards.git .
              git sparse-checkout init --cone
              git sparse-checkout set backend
            else
              git pull origin main
            fi

            # Create the .env file and insert secrets
            echo "${{ secrets.ENV_FILE }}" > .env
            chmod 600 .env  # Secure the file

            # Stop and remove old Docker containers
            sudo docker stop ai-billboards || true
            sudo docker rm ai-billboards || true

            # Build and run the new container
            sudo docker build -t ai-billboards .
            sudo docker run -d --name ai-billboards --env-file .env -p 5000:5000 ai-billboards
          EOF
