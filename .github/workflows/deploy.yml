name: Deploy to EC2

on:
  push:
    branches:
      - main  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ec2_key.pem
          chmod 400 ec2_key.pem

      - name: Deploy over SSH
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ec2-user@18.191.162.75 << 'EOF'
            # Navigate to or create the app directory
            cd /home/ec2-user/ai-billboards || mkdir -p /home/ec2-user/ai-billboards && cd /home/ec2-user/ai-billboards
            
            # Clone or pull the latest code
            if [ ! -d .git ]; then
              git clone https://${{ secrets.GIT_PAT }}@github.com/Birla10/AI-Billboards.git .
            else
              git pull origin main
            fi

            # Stop and remove old Docker containers
            sudo docker stop ai-billboards || true
            sudo docker rm ai-billboards || true

            # Build and run the new container
            sudo docker build -t ai-billboards .
            sudo docker run -d --name ai-billboards -p 5000:5000 ai-billboards
          EOF
