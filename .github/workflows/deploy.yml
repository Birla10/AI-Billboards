name: Deploy Backend to EC2

on:
  push:
    branches:
      - main  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          echo "${{ secrets.AWS_EC2_SSH_KEY }}" | tr -d '\r' > ec2_key.pem
          chmod 400 ec2_key.pem

      - name: Decode SSL certs
        run: |
          echo "${{ secrets.SSL_CERT_B64 }}" | base64 -d > cert.pem
          echo "${{ secrets.SSL_KEY_B64 }}" | base64 -d > key.pem
  
      - name: Upload SSL certs to EC2
        run: |
          scp -i ec2_key.pem -o StrictHostKeyChecking=no cert.pem ec2-user@18.191.162.75:/home/ec2-user/ai-billboards/backend/
          scp -i ec2_key.pem -o StrictHostKeyChecking=no key.pem ec2-user@18.191.162.75:/home/ec2-user/ai-billboards/backend/

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ec2-user@18.191.162.75 << 'EOF'
          cd /home/ec2-user

          # Clone repo if it doesn't exist
          if [ ! -d ai-billboards ]; then
            git clone https://github.com/Birla10/AI-Billboards.git ai-billboards
          fi

          # Navigate to repo and pull latest changes
          cd ai-billboards
          git reset --hard HEAD
          git pull origin main

          # Ensure backend directory exists
          if [ ! -d backend ]; then
            echo "Error: backend folder does not exist!"
            exit 1
          fi
          cd backend

          # Create .env file
          echo "${{ secrets.ENV_FILE }}" > .env
          chmod 600 .env

          # Stop and remove old container
          sudo docker stop ai-billboards || true
          sudo docker rm ai-billboards || true

          # Ensure Dockerfile exists
          if [ ! -f Dockerfile ]; then
            echo "Error: Dockerfile not found in backend directory!"
            exit 1
          fi

          # Build and run the container
          sudo docker build -t ai-billboards .
          sudo docker run -d --name ai-billboards --env-file .env -p 5000:5000 ai-billboards
          EOF
      


