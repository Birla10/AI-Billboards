name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          echo "${{ secrets.AWS_EC2_SSH_KEY }}" | tr -d '\r' > ec2_key.pem
          chmod 400 ec2_key.pem

      # ⬇️ Decode your .env file
      - name: Decode and upload .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          scp -i ec2_key.pem -o StrictHostKeyChecking=no .env ec2-user@18.191.162.75:/home/ec2-user/ai-billboards/backend/.env

      # ⬇️ Decode credential secrets into files
      - name: Decode Firebase and Google JSON
        run: |
          echo "${{ secrets.FIREBASE_JSON_B64 }}" | base64 -d > firebase.json
          echo "${{ secrets.GOOGLE_CLOUD_JSON_B64 }}" | base64 -d > gcloud.json

      # ⬇️ Create credential folders on EC2
      - name: Create credential folders on EC2
        run: |
          ssh -i ec2_key.pem -o StrictHostKeyChecking=no ec2-user@18.191.162.75 << 'EOF'
            mkdir -p /home/ec2-user/ai-billboards/backend/credentials/firebase
            mkdir -p /home/ec2-user/ai-billboards/backend/credentials/google_cloud
          EOF

      # ⬇️ Upload credential files to EC2
      - name: Upload credentials to EC2
        run: |
          scp -i ec2_key.pem -o StrictHostKeyChecking=no firebase.json ec2-user@18.191.162.75:/home/ec2-user/ai-billboards/backend/credentials/firebase/ai-billboards-firebase.json
          scp -i ec2_key.pem -o StrictHostKeyChecking=no gcloud.json ec2-user@18.191.162.75:/home/ec2-user/ai-billboards/backend/credentials/google_cloud/ai-billboards-gcloud.json

      # ⬇️ Upload SSL certs
      - name: Decode and upload SSL certs
        run: |
          echo "${{ secrets.SSL_CERT_B64 }}" | base64 -d > cert.pem
          echo "${{ secrets.SSL_KEY_B64 }}" | base64 -d > key.pem
          scp -i ec2_key.pem -o StrictHostKeyChecking=no cert.pem ec2-user@18.191.162.75:/home/ec2-user/ai-billboards/backend/cert.pem
          scp -i ec2_key.pem -o StrictHostKeyChecking=no key.pem ec2-user@18.191.162.75:/home/ec2-user/ai-billboards/backend/key.pem

      # ⬇️ Deploy backend (clone, pull, build, run Docker)
      - name: Deploy to EC2
        run: |
          ssh -i ec2_key.pem -o StrictHostKeyChecking=no ec2-user@18.191.162.75 << 'EOF'
            cd /home/ec2-user

            if [ ! -d ai-billboards ]; then
              git clone https://github.com/Birla10/AI-Billboards.git ai-billboards
            fi

            cd ai-billboards
            git reset --hard HEAD
            git pull origin main

            if [ ! -d backend ]; then
              echo "Error: backend folder does not exist!"
              exit 1
            fi

            cd backend

            sudo docker stop ai-billboards || true
            sudo docker rm ai-billboards || true
            sudo docker rmi ai-billboards || true

            sudo docker build -t ai-billboards .

            sudo docker run -d \
              --name ai-billboards \
              --env-file .env \
              -p 5000:5000 \
              ai-billboards
          EOF
